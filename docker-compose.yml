services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paylink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-paylink}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paylink} -d ${POSTGRES_DB:-paylink}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-paylink};Username=${POSTGRES_USER:-paylink};Password=${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  # Mock billers (ElectroCo, AquaCo, TopUpNet) will be added in Phase 2.

volumes:
  pgdata:
